<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avtar Water Official</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fdfdfd; text-align: center; margin: 0; padding: 0; scroll-behavior: smooth; }
        
        header { background: #000; padding: 50px 20px; border-bottom: 6px solid #FFD700; }
        .unique-header {
            background: linear-gradient(145deg, #FFD700, #b8860b);
            padding: 15px 35px;
            border: 3px solid #fff;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            transform: skew(-2deg);
        }
        .unique-header h1 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; color: #000; font-weight: 900; }

        .section-title { margin: 40px 0 20px; font-size: 28px; font-weight: bold; text-decoration: underline; }
        
        .gallery-container { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 20px; }
        .card { background: white; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); width: 95%; max-width: 450px; padding: 20px; border: 1px solid #eee; }
        .card img { width: 100%; border-radius: 20px; height: 400px; object-fit: contain; background: #f9f9f9; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; }
        .modal-box { background: white; margin: 10% auto; padding: 20px; width: 85%; border-radius: 20px; position: relative; }
        .modal-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .modal-imgs img { width: 100%; border-radius: 10px; border: 1px solid #ddd; }

        .event-list { background: #111; color: #FFD700; padding: 40px 20px; margin: 50px auto; width: 90%; max-width: 600px; border-radius: 25px; border: 2px solid #FFD700; }

        .order-container { background: white; padding: 45px 20px; border-radius: 40px 40px 0 0; box-shadow: 0 -15px 40px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px; color: #444; }
        input, select { width: 100%; padding: 15px; border: 2px solid #f0f0f0; border-radius: 12px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        
        .qty-btns { display: flex; gap: 10px; margin-bottom: 10px; }
        .qty-btn { flex: 1; padding: 15px; border: 2px solid #FFD700; background: #fff; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; }
        .qty-btn.active { background: #FFD700; color: #000; }

        .order-now-btn { background: #25D366; color: white; border: none; padding: 22px; width: 100%; border-radius: 15px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(37,211,102,0.3); }
    </style>
</head>
<body>

    <header>
        <div class="unique-header">
            <h1>WELCOME TO AVTAR</h1>
        </div>
    </header>

    <div class="section-title">Gallery</div>
    
    <div class="gallery-container">
        <div class="card">
            <img src="IMG-20260224-WA0009.jpg" alt="Standard Bottle">
            <h3>Standard Water Bottle's</h3>
            <p>(AVTAR DRINKS)</p>
        </div>

        <div class="card">
            <img src="1771906211222.png" alt="Customize Bottle" onclick="openGallery()" style="cursor:zoom-in;">
            <h3>Customize Bottle's</h3>
            <p onclick="document.getElementById('event-section').scrollIntoView();" style="color: blue; text-decoration: underline; cursor: pointer; font-weight: bold;">Click to see more ➔</p>
        </div>
    </div>

    <div id="modal">
        <div class="modal-box">
            <button onclick="closeGallery()" style="position:absolute; top:-10px; right:-10px; background:#000; color:#FFD700; border:none; border-radius:50%; width:35px; height:35px; cursor:pointer;">X</button>
            <h3 style="margin-top:0;">Event Special Designs</h3>
            <div class="modal-imgs">
                <img src="1771875480204.png">
                <img src="1771906006716.png">
                <img src="1771906211222.png">
            </div>
        </div>
    </div>

    <div class="event-list" id="event-section">
        <h2 style="margin-top:0;">CUSTOMIZE FOR ANY EVENT ↓</h2>
        <p style="font-size: 18px; font-weight: bold;">WEDDING, GIFTING, FESTIVAL, CHARITY, HOTEL'S, CAFE ---- etc.</p>
    </div>

    <div class="order-container">
        <h2 style="text-align: center; text-decoration: underline; margin-bottom: 30px;">CHOOSE BOTTLE'S</h2>
        
        <form id="orderForm">
            <label>BOTTLE TYPE</label>
            <select id="bottleType">
                <option value="Standard Water Bottle">Standard Water Bottle</option>
                <option value="Customize Water Bottle">Customize Water Bottle</option>
            </select>

            <label>QUANTITY</label>
            <div class="qty-btns">
                <div class="qty-btn active" onclick="setQty('1', this)">1</div>
                <div class="qty-btn" onclick="setQty('2', this)">2</div>
                <div class="qty-btn" onclick="setQty('3', this)">3</div>
                <div class="qty-btn" onclick="setQty('Custom', this)">More</div>
            </div>
            <input type="number" id="manualQty" placeholder="Botal ki sankhya likhein" style="display: none;">
            <input type="hidden" id="selectedQty" value="1">

            <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 10px;">DELIVERY ADDRESS ↓</h3>
            <input type="text" id="custName" placeholder="Full Name" required>
            <input type="tel" id="custPhone" value="+91 ">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="city" placeholder="City" required>
                <input type="text" id="state" placeholder="State" required>
            </div>
            <input type="text" id="house" placeholder="House No / Area" required>

            <button type="button" class="order-now-btn" onclick="sendWhatsApp()">ORDER NOW ON WHATSAPP</button>
        </form>
    </div>

    <script>
        function openGallery() { document.getElementById('modal').style.display = 'block'; }
        function closeGallery() { document.getElementById('modal').style.display = 'none'; }

        function setQty(val, btn) {
            document.getElementById('selectedQty').value = val;
            let btns = document.querySelectorAll('.qty-btn');
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('manualQty').style.display = (val === 'Custom') ? 'block' : 'none';
        }

        function sendWhatsApp() {
            let type = document.getElementById('bottleType').value;
            let qty = (document.getElementById('selectedQty').value === 'Custom') ? document.getElementById('manualQty').value : document.getElementById('selectedQty').value;
            let name = document.getElementById('custName').value;
            let city = document.getElementById('city').value;
            let house = document.getElementById('house').value;

            if(!name || !city || !qty) { alert("Please fill all details!"); return; }

            let msg = `*AVTAR ORDER*%0A*Bottle:* ${type}%0A*Qty:* ${qty}%0A*Name:* ${name}%0A*Address:* ${house}, ${city}`;
            window.open(`https://wa.me/917535034146?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
