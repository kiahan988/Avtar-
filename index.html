<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avtar Water Official</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #ffffff; margin: 0; padding: 0; text-align: center; }
        header { background: #000; padding: 40px 10px; border-bottom: 6px solid #FFD700; }
        .welcome-box { border: 3px solid #FFD700; display: inline-block; padding: 15px 30px; border-radius: 50px; background: linear-gradient(145deg, #FFD700, #b8860b); }
        .welcome-box h1 { margin: 0; font-size: 20px; color: #000; text-transform: uppercase; letter-spacing: 2px; }
        .section-title { font-size: 32px; font-weight: bold; margin: 40px 0 10px; text-decoration: underline; }
        .main-content { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 30px; padding-bottom: 50px; }
        .card { width: 90%; max-width: 400px; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .card img { width: 100%; height: auto; border-radius: 15px; background: #f9f9f9; }
        .gallery-link { color: #007bff; font-weight: bold; text-decoration: underline; cursor: pointer; display: block; margin-top: 10px; font-size: 18px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .modal-content { background: #fff; margin: 20px auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 20px; position: relative; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .modal-grid img { width: 100%; border-radius: 10px; border: 1px solid #ddd; }
        .close-btn { position: absolute; top: -10px; right: -10px; background: #000; color: #FFD700; border: none; border-radius: 50%; width: 40px; height: 40px; font-weight: bold; cursor: pointer; }
        .order-section { background: #fff; width: 100%; padding: 40px 20px; box-sizing: border-box; border-top: 2px solid #eee; text-align: left; max-width: 600px; margin: 0 auto; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-bottom: 8px; }
        input, select { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .qty-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .qty-item { flex: 1; padding: 15px; border: 2px solid #FFD700; text-align: center; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .qty-item.active { background: #FFD700; color: #000; }
        
        /* Location Button Styling */
        .btn-loc { background: #f0f0f0; border: 2px dashed #888; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; margin-bottom: 20px; font-weight: bold; color: #555; }
        .btn-loc.success { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }

        .btn-order { background: #25D366; color: #fff; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(37,211,102,0.3); }
        .black-banner { background: #000; color: #FFD700; padding: 30px 10px; margin: 40px 0; }
    </style>
</head>
<body>

    <header>
        <div class="welcome-box"><h1>WELCOME TO AVTAR</h1></div>
    </header>

    <div class="section-title">Gallery</div>
    <div class="main-content">
        <div class="card">
            <img src="1771936547800.png" alt="Standard Bottle">
            <h3>Standard Water Bottle's</h3>
            <p>(AVTAR DRINKS)</p>
        </div>
        <div class="card">
            <img src="1771906211222.png" alt="Customize Bottle" onclick="toggleGallery()">
            <h3>Customize Bottle's</h3>
            <span class="gallery-link" onclick="toggleGallery()">Click to see more ➔</span>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleGallery()">X</button>
            <h2 style="margin-top:0">All Designs</h2>
            <div class="modal-grid">
                <img src="1771875480204.png"><img src="1771906006716.png">
                <img src="1771906199750.png"><img src="1771906211222.png">
            </div>
        </div>
    </div>

    <div class="black-banner">
        <h2>CUSTOMIZE FOR ANY EVENT ↓</h2>
        <p>WEDDING, GIFTING, FESTIVAL, CHARITY, HOTEL'S, CAFE etc.</p>
    </div>

    <div class="order-section">
        <h2>CHOOSE BOTTLE'S</h2>
        <form id="orderForm">
            <label>BOTTLE TYPE</label>
            <select id="type">
                <option value="Standard">Standard Water Bottle</option>
                <option value="Customize">Customize Water Bottle</option>
            </select>

            <label>QUANTITY</label>
            <div class="qty-box">
                <div class="qty-item active" onclick="setQty('1', this)">1</div>
                <div class="qty-item" onclick="setQty('2', this)">2</div>
                <div class="qty-item" onclick="setQty('3', this)">3</div>
                <div class="qty-item" onclick="setQty('More', this)">More</div>
            </div>
            <input type="number" id="customQty" placeholder="Your Quantity" style="display:none;">
            <input type="hidden" id="finalQty" value="1">

            <h3 style="margin-top:40px; text-decoration: underline;">DELIVERY ADDRESS ↓</h3>
            
            <button type="button" id="locBtn" class="btn-loc" onclick="getLocation()">📍 Get My Exact Location (Optional)</button>
            <input type="hidden" id="mapLink" value="Not Provided">

            <label>NAME</label>
            <input type="text" id="name" placeholder="Aapka Naam" required>

            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label>STATE</label><input type="text" id="state" placeholder="State"></div>
                <div style="flex:1;"><label>CITY</label><input type="text" id="city" placeholder="City"></div>
            </div>

            <label>HOUSE NO / BUILDING NO.</label>
            <input type="text" id="house" placeholder="House Details">

            <button type="button" class="btn-order" onclick="orderWhatsApp()">ORDER NOW ON WHATSAPP</button>
        </form>
    </div>

    <script>
        function toggleGallery() {
            const m = document.getElementById('modal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }

        function setQty(val, el) {
            document.getElementById('finalQty').value = val;
            document.querySelectorAll('.qty-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('customQty').style.display = (val === 'More') ? 'block' : 'none';
        }

        function getLocation() {
            const btn = document.getElementById('locBtn');
            if (navigator.geolocation) {
                btn.innerText = "Finding Location...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    document.getElementById('mapLink').value = link;
                    btn.innerText = "✅ Location Saved!";
                    btn.classList.add('success');
                }, () => {
                    alert("Location access denied. Please type address manually.");
                    btn.innerText = "❌ Location Failed";
                });
            }
        }

        function orderWhatsApp() {
            const type = document.getElementById('type').value;
            const q = (document.getElementById('finalQty').value === 'More') ? document.getElementById('customQty').value : document.getElementById('finalQty').value;
            const name = document.getElementById('name').value;
            const city = document.getElementById('city').value;
            const house = document.getElementById('house').value;
            const maps = document.getElementById('mapLink').value;

            if(!name || !q) { alert("Details fill karein!"); return; }

            const msg = `*AVTAR ORDER*%0A*Bottle:* ${type}%0A*Qty:* ${q}%0A*Name:* ${name}%0A*Address:* ${house}, ${city}%0A*Map Link:* ${maps}`;
            window.open(`https://wa.me/917535034146?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
