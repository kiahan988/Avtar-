<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avtar Water Booking</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 0; }
        header { background: #FFD700; padding: 15px; font-weight: bold; font-size: 22px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .gallery-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 20px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 45%; max-width: 250px; padding: 15px; cursor: pointer; }
        .card img { width: 100%; border-radius: 10px; height: 200px; object-fit: contain; }
        .card h3 { font-size: 16px; margin: 10px 0 5px; }
        
        /* Modal Style */
        #galleryModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
        .modal-content { background: white; margin: 15% auto; padding: 20px; width: 85%; border-radius: 15px; position: relative; }
        .modal-images { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal-images img { width: 100%; border-radius: 8px; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: #ff4444; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }

        /* Form */
        .order-section { background: white; padding: 25px; border-radius: 30px 30px 0 0; margin-top: 20px; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .submit-btn { background: #FFD700; color: #000; font-weight: bold; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 17px; }
    </style>
</head>
<body>

    <header>AVTAR WATER CUSTOMS</header>

    <h2 style="margin-top:20px;">Gallery</h2>
    
    <div class="gallery-container">
        <div class="card">
            <img src="1771913800868.png" alt="Standard Bottle">
            <h3>Standard Water Bottle</h3>
            <p>(AVTAR Brand)</p>
        </div>

        <div class="card" onclick="openGallery()">
            <img src="1771906211222.png" alt="Wedding Special">
            <h3>Wedding Special</h3>
            <p><strong>Custom Bottle</strong></p>
            <small style="color:blue;">Click to see more</small>
        </div>
    </div>

    <div id="galleryModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeGallery()">X</button>
            <h3>Wedding Designs</h3>
            <div class="modal-images">
                <img src="1771875480204.png">
                <img src="1771906006716.png">
                <img src="1771906211222.png">
            </div>
        </div>
    </div>

    <div class="order-section">
        <h3>Order Booking</h3>
        <form action="https://formspree.io/f/mgolppaa" method="POST" id="orderForm">
            <input type="text" name="Name" id="name" placeholder="Aapka Naam Likhein" required>
            <select name="BottleType" id="type">
                <option value="Standard Bottle">Standard Water Bottle</option>
                <option value="Wedding Bottle">Wedding Special Bottle</option>
            </select>
            <input type="number" name="Quantity" id="qty" placeholder="Kitni botal chahiye?" required>
            <textarea name="Address" id="addr" rows="3" placeholder="Address aur Mobile No." required></textarea>
            <button type="button" class="submit-btn" onclick="sendOrder()">Order Request Bheinjein</button>
        </form>
    </div>

    <script>
        function openGallery() { document.getElementById('galleryModal').style.display = 'block'; }
        function closeGallery() { document.getElementById('galleryModal').style.display = 'none'; }

        function sendOrder() {
            let n = document.getElementById('name').value;
            let t = document.getElementById('type').value;
            let q = document.getElementById('qty').value;
            let a = document.getElementById('addr').value;

            if(n=="" || q=="" || a=="") { alert("Details bhariye!"); return; }

            // WhatsApp link
            let msg = `*Naya Order!*%0A*Naam:* ${n}%0A*Bottle:* ${t}%0A*Quantity:* ${q}%0A*Address:* ${a}`;
            window.open(`https://wa.me/917535034146?text=${msg}`, '_blank');

            // Formspree Submit
            document.getElementById('orderForm').submit();
        }
    </script>

</body>
</html>
